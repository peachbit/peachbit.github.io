<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peachbit</title>
<meta name="description" content="Peachbit — small, handy utilities for Windows.">
<link rel="alternate" hreflang="de" href="https://peachbit.github.io/de/">
<link rel="alternate" hreflang="en" href="https://peachbit.github.io/en/">
<link rel="alternate" hreflang="es" href="https://peachbit.github.io/es/">
<link rel="alternate" hreflang="fr" href="https://peachbit.github.io/fr/">
<link rel="alternate" hreflang="it" href="https://peachbit.github.io/it/">
<link rel="alternate" hreflang="pl" href="https://peachbit.github.io/pl/">
<link rel="alternate" hreflang="pt-BR" href="https://peachbit.github.io/pt-br/">
<link rel="alternate" hreflang="ja" href="https://peachbit.github.io/ja/">
<link rel="alternate" hreflang="zh-Hans" href="https://peachbit.github.io/zh-hans/">
<link rel="alternate" hreflang="zh-Hant" href="https://peachbit.github.io/zh-hant/">
<link rel="alternate" hreflang="ko" href="https://peachbit.github.io/ko/">
<link rel="alternate" hreflang="x-default" href="https://peachbit.github.io/">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="img/peachbit-icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="img/peachbit-icon-512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script>
(function () {
  var langs = ["de", "en", "es", "fr", "it", "pl", "pt-br", "ja", "zh-hans", "zh-hant", "ko"], saved = null;
  try { saved = localStorage.getItem("pb-lang"); } catch (e) {}
  function pick() {
    if (saved && langs.indexOf(saved) >= 0) return saved;
    var list = navigator.languages || [navigator.language || "en"];
    for (var i = 0; i < list.length; i++) {
      var l = String(list[i]).toLowerCase(), base = l.split("-")[0];
      if (base === "zh") return /(tw|hk|mo|hant)/.test(l) ? "zh-hant" : "zh-hans";
      if (base === "pt") return "pt-br";
      if (langs.indexOf(base) >= 0) return base;
    }
    return "en";
  }
  location.replace("" + pick() + "/");
})();
</script>
<main>
<h1 class="logo"><picture><source srcset="img/peachbit-logo-dark.png" media="(prefers-color-scheme: dark)"><img src="img/peachbit-logo-light.png" alt="Peachbit" width="276" height="80"></picture></h1>
<ul class="pick">
<li><a href="de/" data-lang="de" lang="de">Deutsch</a></li>
<li><a href="en/" data-lang="en" lang="en">English</a></li>
<li><a href="es/" data-lang="es" lang="es">Español</a></li>
<li><a href="fr/" data-lang="fr" lang="fr">Français</a></li>
<li><a href="it/" data-lang="it" lang="it">Italiano</a></li>
<li><a href="pl/" data-lang="pl" lang="pl">Polski</a></li>
<li><a href="pt-br/" data-lang="pt-br" lang="pt-BR">Português (Brasil)</a></li>
<li><a href="ja/" data-lang="ja" lang="ja">日本語</a></li>
<li><a href="zh-hans/" data-lang="zh-hans" lang="zh-Hans">简体中文</a></li>
<li><a href="zh-hant/" data-lang="zh-hant" lang="zh-Hant">繁體中文</a></li>
<li><a href="ko/" data-lang="ko" lang="ko">한국어</a></li>
</ul>
</main>
<script>
document.querySelectorAll("[data-lang]").forEach(function (a) {
  a.addEventListener("click", function () {
    try { localStorage.setItem("pb-lang", a.getAttribute("data-lang")); } catch (e) {}
  });
});
</script>
</body>
</html>
